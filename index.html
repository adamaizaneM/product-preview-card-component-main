<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Product Preview Card Component</title>
</head>
<body>
  <div class="card">
    <!-- Image Section -->
    <div class="image-container">
      <img src="images/image-product-desktop.jpg" alt="Perfume Bottle" class="desktop-image">
      <img src="images/image-product-mobile.jpg" alt="Perfume Bottle" class="mobile-image">
    </div>
    <!-- Content Section -->
    <div class="card-content">
     <h1 class="card-title">  Perfume </h1>
      <h1 class="main-title">Gabrielle Essence Eau De Parfum</h1>
      <p class="main-text">
        A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.
      </p>
      <div class="price-container">
        <span class="current-price">$149.99</span>
        <span class="original-price">$169.99</span>
      </div>
      <button type="button" class="add-to-cart">
        <img src="images/icon-cart.svg" alt="Cart Icon">
        Add to Cart
      </button>
    </div>
  </div>
</body>
</html>
